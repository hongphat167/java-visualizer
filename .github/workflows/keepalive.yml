name: keepalive

# Render's free plan sleeps a service after 15 minutes with no requests, and the
# next visitor then waits ~50s for the JVM to boot. Ping /healthz often enough
# that the instance never sleeps.
on:
  schedule:
    # GitHub delays scheduled runs under load, so ask for 5 minutes to reliably
    # land inside the 15-minute window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://java-visualizer.onrender.com/healthz
