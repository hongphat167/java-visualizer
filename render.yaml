services:
  - type: web
    name: java-visualizer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # This server compiles and runs submitted Java. Without these it refuses
      # to listen on a public interface. Set them in the Render dashboard.
      - key: VIZ_USER
        sync: false
      - key: VIZ_PASS
        sync: false
